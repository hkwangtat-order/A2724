<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:title" content="究極堂(炮) - 常用貨品落單表">
    <meta property="og:description" content="香港宏達有限公司提供">
    
    <title>究極堂(炮) - 專用訂貨單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8f9fa; padding-bottom: 100px; }
        .top-bar { background-color: #212529; color: white; padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .client-name { font-size: 1.3rem; font-weight: 800; color: #ffc107; } 
        .product-row { background: white; border-bottom: 1px solid #eee; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .p-name { font-size: 1.1rem; font-weight: 700; color: #000; line-height: 1.4; }
        .qty-control { display: flex; align-items: center; background: #fff; border: 1px solid #ced4da; border-radius: 8px; padding: 2px; width: 130px; justify-content: space-between; height: 45px; flex-shrink: 0; margin-left: 10px; }
        .qty-btn { width: 40px; height: 100%; border-radius: 6px; background: #f8f9fa; color: #212529; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 1.5rem; user-select: none; }
        .qty-btn:active { background: #ffc107; }
        .qty-input { width: 40px; text-align: center; border: none; font-weight: bold; font-size: 1.3rem; color: #333; background: transparent; }
        .product-row.selected { background-color: #fffbf0; border-left: 5px solid #ffc107; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1020; }
        .total-info { font-size: 1.2rem; font-weight: bold; color: #333; }
        .btn-whatsapp { background: #25D366; color: white; border: none; padding: 12px 35px; border-radius: 50px; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .search-container { padding: 10px; background: white; position: sticky; top: 70px; z-index: 980; border-bottom: 1px solid #eee; }
        .form-control { border-radius: 20px; padding: 10px 20px; background-color: #f1f3f5; border: none; font-size: 1rem; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <div class="client-name">究極堂(炮)</div>
            <div style="font-size: 0.9rem; opacity: 0.9; color: #ddd;">常用貨品訂單</div>
        </div>
        <div style="text-align: right; font-size: 0.85rem; color: #ccc;">
            宏達批發<br>Tel: 63771688
        </div>
    </div>
</div>

<div class="search-container">
    <input type="text" id="searchInput" class="form-control" placeholder="🔍 在清單中搜尋..." onkeyup="filterProducts()">
</div>

<div id="product-list">
    </div>

<div class="bottom-bar">
    <div class="total-info">
        共 <span id="totalQty" style="color: #d32f2f; font-size: 1.5rem;">0</span> 件貨品
    </div>
    <button class="btn-whatsapp" onclick="sendWhatsApp()">
        <i class="bi bi-whatsapp"></i> 發送訂單
    </button>
</div>

<script>
    // === 產品數據庫 (究極堂-炮 專用) ===
    const products = [
        { name: "阿根廷赤蝦L1" },
        { name: "開邊赤蝦9L" },
        { name: "日本刺身帶子4S" },
        { name: "活赤貝" },
        { name: "油甘魚" },
        { name: "生左口魚邊刺身1kg" },
        { name: "日式炭燒雞扒" },
        { name: "軟殼蟹100/120g" },
        { name: "北海道鱒魚籽" },
        { name: "日式煎菜肉餃子" },
        { name: "日本仿拖羅油脂900ml" },
        { name: "日本豉油包750x3cc" },
        { name: "日本紋甲500g" },
        { name: "有頭甜蝦3L(40/50)" },
        { name: "鮪魚腩碎(築地)" }
    ];

    // 生成唯一 ID
    products.forEach((p, index) => {
        p.id = "U" + (index + 1).toString().padStart(3, '0');
    });

    let cart = {}; 

    function init() {
        renderTable();
    }

    function renderTable(filterText = "") {
        const container = document.getElementById('product-list');
        let html = '';
        
        const filteredProducts = products.filter(p => {
            if (!filterText) return true;
            return p.name.includes(filterText);
        });

        filteredProducts.forEach(p => {
            const qty = cart[p.id] || 0;
            const rowClass = qty > 0 ? 'selected' : '';

            html += `
            <div class="product-row ${rowClass}">
                <div class="p-name">${p.name}</div>
                <div class="qty-control">
                    <div class="qty-btn" onclick="updateQty('${p.id}', -1)">-</div>
                    <input type="text" class="qty-input" id="qty-${p.id}" value="${qty}" readonly>
                    <div class="qty-btn" onclick="updateQty('${p.id}', 1)">+</div>
                </div>
            </div>`;
        });

        if (filteredProducts.length === 0) {
            html = '<div class="text-center p-5 text-muted">找不到相關產品</div>';
        }
        container.innerHTML = html;
    }

    function filterProducts() {
        const text = document.getElementById('searchInput').value;
        renderTable(text);
    }

    function updateQty(id, delta) {
        if (!cart[id]) cart[id] = 0;
        cart[id] += delta;
        if (cart[id] <= 0) delete cart[id];
        
        const input = document.getElementById(`qty-${id}`);
        if (input) {
            input.value = cart[id] || 0;
            const row = input.closest('.product-row');
            if (cart[id] > 0) row.classList.add('selected');
            else row.classList.remove('selected');
        }
        calculateTotal();
    }

    function calculateTotal() {
        let count = 0;
        for (let [id, q] of Object.entries(cart)) {
            count += q; 
        }
        document.getElementById('totalQty').innerText = count;
    }

    // === 發送 WhatsApp (量產格式版) ===
    function sendWhatsApp() {
        if (Object.keys(cart).length === 0) {
            alert("請先選擇產品！");
            return;
        }

        // --- 客戶資料 ---
        const customerCode = "A2724"; 
        const customerName = "究極堂(炮)";
        const phone = "85263771688"; 

        // 格式：[編號] [名稱] 換行 訂貨單：
        let msg = `${customerCode} ${customerName}\n訂貨單：\n\n`;

        const orderedCart = products.filter(p => cart[p.id]);
        
        orderedCart.forEach(p => {
            const q = cart[p.id];
            // 格式：[空格] [數量] [空格] [產品名]
            msg += ` ${q}   ${p.name}\n`;
        });

        const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
    }

    init();
</script>

</body>

</html>
