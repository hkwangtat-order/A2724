<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>系統升級跳轉中...</title>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: "Microsoft JhengHei", sans-serif; background: #f8f9fa; text-align: center; margin: 0; }
        .loader { border: 5px solid #e0e0e0; border-top: 5px solid #ffc107; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .text { color: #555; font-weight: bold; font-size: 1.1rem; }
        .sub-text { color: #999; font-size: 0.9rem; margin-top: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="text">系統升級完成，正在為您跳轉...</div>
    <div class="sub-text">Redirecting to new system...</div>

    <script>
        // 👇👇👇 請修改這裡的 ID (每個倉庫都要改！) 👇👇👇
        const clientID = "A2724"; 
        // 👆👆👆 改成該客戶對應的編號 👆👆👆

        // 新系統地址 (請確認您的倉庫名是 new-clients)
        const newSystemUrl = "https://hkwangtat-order.github.io/new-clients/index.html";
        
        // 執行跳轉
        window.location.href = newSystemUrl + "?id=" + clientID;
    </script>
</body>
</html>
